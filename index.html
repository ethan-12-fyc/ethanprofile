<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>个人资料</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --row-color: #e9e9e9;
      --row-hover: #dfdfdf;
      --page-color: #ffffff;
      --header-color: rgba(255, 255, 255, .96);
      color-scheme: light;
      font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #151515;
      background: var(--page-color);
    }
    body { margin: 0; min-width: 320px; background: var(--page-color); }
    button, input { font: inherit; }
    button { color: inherit; }

    .page {
      width: 100%;
      min-height: 100vh;
      padding: 0 clamp(14px, 3vw, 44px) 52px;
      background: var(--page-color);
    }
    .header {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 72px;
      background: var(--header-color);
      border-bottom: 1px solid #ededed;
      backdrop-filter: blur(8px);
    }
    h1 { margin: 0; font-size: 24px; font-weight: 500; }
    .header-actions { display: flex; align-items: center; gap: 4px; }
    .close {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #555;
      font-size: 31px;
      line-height: 34px;
      cursor: pointer;
    }
    .close:hover, .close:focus-visible { background: #ededed; outline: none; }
    .settings-button { position: relative; top: -2px; font-size: 25px; line-height: 38px; }

    .list { display: grid; gap: 10px; padding-top: 18px; }
    .row.settings-only { display: none; }
    .row[hidden], .row[data-field="language"] { display: none !important; }
    .row {
      min-height: 58px;
      display: grid;
      grid-template-columns: minmax(90px, 22%) 1fr auto;
      align-items: center;
      gap: 16px;
      padding: 10px 18px;
      border: 0;
      border-radius: 7px;
      background: var(--row-color);
      text-align: left;
    }
    button.row { width: 100%; cursor: pointer; }
    button.row:hover { background: var(--row-hover); }
    button.row:focus-visible { outline: 2px solid #333; outline-offset: 2px; }
    .label { font-size: 15px; color: #222; }
    .value { min-width: 0; color: #111; text-align: right; overflow-wrap: anywhere; }
    .muted { color: #707070; }
    .arrow { color: #666; font-size: 22px; }
    .text-input {
      width: 100%;
      min-width: 0;
      padding: 8px 10px;
      border: 1px solid transparent;
      border-radius: 5px;
      background: transparent;
      text-align: right;
      color: #111;
      caret-color: #111;
      outline: none;
    }
    .text-input::placeholder { color: #6f6f6f; opacity: 1; }
    .text-input:hover,
    .text-input:focus { border-color: transparent; background: transparent; box-shadow: none; }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(0, 0, 0, .34);
    }
    .overlay[hidden] { display: none; }
    .dialog {
      width: min(460px, 100%);
      max-height: min(650px, 84vh);
      overflow: auto;
      padding: 24px;
      border-radius: 12px;
      background: var(--page-color);
      box-shadow: 0 18px 60px rgba(0,0,0,.23);
    }
    .dialog-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .dialog h2 { margin: 0; font-size: 20px; font-weight: 500; }
    .dialog-close { border: 0; background: transparent; color: #666; font-size: 25px; cursor: pointer; }
    .choices { display: grid; gap: 9px; }
    .location-search {
      position: sticky;
      top: -24px;
      z-index: 1;
      width: 100%;
      margin-bottom: 3px;
      padding: 13px 15px;
      border: 1px solid #bdbdbd;
      border-radius: 7px;
      background: var(--page-color);
      color: #111;
      font: inherit;
    }
    .location-search:focus { border-color: #333; outline: 2px solid rgba(0,0,0,.12); }
    .choice {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid #d5d5d5;
      border-radius: 7px;
      background: #f4f4f4;
      text-align: left;
      cursor: pointer;
    }
    .choice:hover, .choice:focus-visible { border-color: #555; background: #e8e8e8; outline: none; }
    .choice[aria-checked="true"] { border-color: #222; background: #dedede; font-weight: 600; }
    .settings-list { display: grid; gap: 10px; }
    .settings-item {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 15px;
      border: 0;
      border-radius: 7px;
      background: var(--row-color);
      text-align: left;
      cursor: pointer;
    }
    .settings-item:hover, .settings-item:focus-visible { background: var(--row-hover); outline: 2px solid #333; }
    .color-dot {
      display: inline-block;
      width: 18px;
      height: 18px;
      margin-right: 11px;
      border: 1px solid rgba(0,0,0,.18);
      border-radius: 4px;
      vertical-align: -4px;
    }

    .closed {
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: #666;
      background: #f5f5f5;
    }
    .closed[hidden] { display: none; }
    .language-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f5f5f5;
    }
    .language-screen[hidden] { display: none; }
    .language-card { width: min(420px, 100%); text-align: center; }
    .language-card h1 { margin: 0 0 18px; font-size: 23px; }
    .language-buttons { display: grid; gap: 10px; }
    .language-choice {
      width: 100%;
      padding: 14px 18px;
      border: 1px solid #d0d0d0;
      border-radius: 7px;
      background: #e9e9e9;
      color: #111;
      cursor: pointer;
    }
    .language-choice:hover, .language-choice:focus-visible { border-color: #555; background: #dfdfdf; outline: none; }
    .lock-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f5f5f5;
    }
    .lock-screen[hidden] { display: none; }
    .password-form { width: min(420px, 100%); text-align: center; }
    .password-input {
      width: 100%;
      height: 58px;
      padding: 0 18px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: #e9e9e9;
      color: #111;
      font-weight: 400;
      text-align: center;
      outline: none;
    }
    .password-input:focus { border-color: #777; background: #e2e2e2; }
    .password-input::placeholder { color: #333; opacity: 1; }
    .unlock-button {
      margin-top: 12px;
      padding: 10px 24px;
      border: 0;
      border-radius: 7px;
      background: #555;
      color: #fff;
      cursor: pointer;
    }
    .password-error { min-height: 22px; margin: 10px 0 0; color: #a12626; font-size: 14px; }
    .change-password-form { display: grid; gap: 10px; }
    .change-password-form .password-input { height: 50px; }
    .change-password-message { min-height: 21px; margin: 0; color: #a12626; font-size: 14px; text-align: center; }
    .change-password-message.success { color: #23713c; }

    .flappy-view {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #dff7ff;
      color: #18333c;
      font-family: ui-rounded, "Arial Rounded MT Bold", Arial, sans-serif;
    }
    .flappy-view[hidden] { display: none; }
    .flappy-shell {
      position: relative;
      width: min(100vw, 520px);
      height: min(100vh, 760px);
      overflow: hidden;
      background: #7bd9f6;
      box-shadow: 0 18px 50px rgba(28, 99, 122, .2);
      touch-action: manipulation;
      user-select: none;
    }
    #flappyCanvas { display: block; width: 100%; height: 100%; }
    .flappy-hud { position: absolute; inset: 0; pointer-events: none; }
    .flappy-score {
      position: absolute;
      top: 26px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-size: clamp(38px, 10vw, 58px);
      font-weight: 900;
      line-height: 1;
      text-shadow: 0 3px 0 #244a55, 2px 0 0 #244a55, -2px 0 0 #244a55;
    }
    .flappy-message {
      position: absolute;
      top: 43%;
      left: 50%;
      width: min(84%, 360px);
      transform: translate(-50%, -50%);
      padding: 22px 24px;
      border: 3px solid #315b63;
      border-radius: 18px;
      background: rgba(255, 250, 220, .94);
      text-align: center;
      box-shadow: 0 7px 0 rgba(49, 91, 99, .24);
    }
    .flappy-message[hidden] { display: none; }
    .flappy-message h2 { margin: 0 0 9px; color: #e56b3f; font-size: clamp(30px, 8vw, 44px); }
    .flappy-message p { margin: 6px 0; font-size: 16px; line-height: 1.45; }
    .flappy-message .flappy-result { margin: 12px 0 2px; font-size: 20px; font-weight: 800; }
    .flappy-key {
      display: inline-block;
      padding: 3px 10px;
      border: 2px solid #72959b;
      border-radius: 7px;
      background: #fff;
      box-shadow: 0 3px 0 #aac1c5;
      font-size: 14px;
      font-weight: 800;
    }
    .flappy-exit {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 42px;
      height: 42px;
      padding: 0;
      border: 2px solid #315b63;
      border-radius: 50%;
      background: rgba(255,255,255,.88);
      color: #315b63;
      font: 400 31px/36px Arial, sans-serif;
      cursor: pointer;
      pointer-events: auto;
    }
    .flappy-exit:hover, .flappy-exit:focus-visible { background: #fff; outline: 3px solid rgba(255,255,255,.75); }

    @media (max-width: 560px) {
      .page { padding-inline: 12px; }
      .header { height: 62px; }
      h1 { font-size: 21px; }
      .row { grid-template-columns: 84px 1fr auto; gap: 8px; padding-inline: 13px; }
      .label, .value, .text-input { font-size: 14px; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .dialog { animation: appear .18s ease-out; }
      @keyframes appear { from { transform: translateY(8px); opacity: 0; } }
    }
  </style>
</head>
<body>
  <section class="flappy-view" id="flappyView" hidden>
    <main class="flappy-shell" id="flappyShell" aria-label="Flappy Bird game. Press Space or tap to make the bird fly upward.">
      <canvas id="flappyCanvas" tabindex="0"></canvas>
      <div class="flappy-hud">
        <div class="flappy-score" id="flappyScore">0</div>
        <button class="flappy-exit" id="flappyExit" type="button" aria-label="Return to login">×</button>
        <section class="flappy-message" id="flappyMessage">
          <h2 id="flappyMessageTitle">Flappy Bird</h2>
          <p id="flappyMessageText">Guide the little bird through the pipes.</p>
          <p id="flappyControls"><span class="flappy-key">SPACE</span> or tap to flap</p>
          <p class="flappy-result" id="flappyResult"></p>
        </section>
      </div>
    </main>
  </section>

  <section class="language-screen" id="languageScreen">
    <div class="language-card">
      <h1>选择语言 · Choose a language</h1>
      <div class="language-buttons">
        <button class="language-choice" type="button" data-language-code="zh">中文</button>
        <button class="language-choice" type="button" data-language-code="yue">廣東話</button>
        <button class="language-choice" type="button" data-language-code="en">English</button>
        <button class="language-choice" type="button" data-language-code="ja">日本語</button>
        <button class="language-choice" type="button" data-language-code="ko">한국어</button>
        <button class="language-choice" type="button" data-language-code="fr">Français</button>
      </div>
    </div>
  </section>

  <section class="lock-screen" id="lockScreen" hidden>
    <form class="password-form" id="passwordForm">
      <input class="password-input" id="passwordInput" type="password" placeholder="密码" aria-label="密码" autocomplete="current-password" required>
      <button class="unlock-button" id="unlockButton" type="submit">打开</button>
      <p class="password-error" id="passwordError" role="alert" aria-live="polite"></p>
    </form>
  </section>

  <main class="page" id="profilePage" hidden>
    <header class="header">
      <h1 id="pageTitle">个人资料</h1>
      <div class="header-actions">
        <button class="close settings-button" id="settingsOpen" type="button" aria-label="设置">⚙</button>
        <button class="close" id="pageClose" type="button" aria-label="关闭个人资料">×</button>
      </div>
    </header>

    <section class="list" id="profileList" aria-label="个人资料字段">
      <label class="row" data-field="nickname">
        <span class="label">昵称</span>
        <input class="text-input" type="text" aria-label="昵称">
      </label>
      <button class="row select-row" type="button" data-field="gender" data-selected="0">
        <span class="label">性别</span><span class="value">女</span><span class="arrow">›</span>
      </button>
      <label class="row" data-field="birthday">
        <span class="label">生日</span>
        <input class="text-input" type="date" aria-label="生日">
      </label>
      <button class="row select-row" type="button" data-field="location" data-selected="-1" data-country="" data-state="">
        <span class="label">所在地</span><span class="value">上海</span><span class="arrow">›</span>
      </button>
      <label class="row" data-field="bio">
        <span class="label">个人简介</span>
        <input class="text-input" type="text" aria-label="个人简介">
      </label>
      <button class="row select-row" type="button" data-field="relationship" data-selected="-1">
        <span class="label">感情状态</span><span class="value muted">未填写</span><span class="arrow">›</span>
      </button>
      <label class="row" data-field="occupation">
        <span class="label">职业</span>
        <input class="text-input" type="text" placeholder="请输入职业" aria-label="职业">
      </label>
      <button class="row select-row" type="button" data-field="education" data-selected="2">
        <span class="label">教育程度</span><span class="value">本科</span><span class="arrow">›</span>
      </button>
      <label class="row" data-field="school">
        <span class="label">学校</span>
        <input class="text-input" type="text" placeholder="请输入学校名称" aria-label="学校">
      </label>
      <button class="row select-row" type="button" data-field="interests" data-selected="1">
        <span class="label">兴趣爱好</span><span class="value">摄影</span><span class="arrow">›</span>
      </button>
      <button class="row select-row" type="button" data-field="language" data-selected="0" hidden>
        <span class="label">常用语言</span><span class="value">中文</span><span class="arrow">›</span>
      </button>
      <label class="row" data-field="hometown">
        <span class="label">家乡</span>
        <input class="text-input" type="text" aria-label="家乡">
      </label>
      <button class="row select-row" type="button" data-field="zodiac" data-selected="2">
        <span class="label">星座</span><span class="value">双子座</span><span class="arrow">›</span>
      </button>
      <button class="row select-row settings-only" type="button" data-field="theme" data-selected="9">
        <span class="label">主题颜色</span><span class="value">灰色</span><span class="arrow">›</span>
      </button>
      <button class="row select-row settings-only" type="button" data-field="visibility" data-selected="0">
        <span class="label">资料可见范围</span><span class="value">所有人</span><span class="arrow">›</span>
      </button>
      <button class="row select-row settings-only" type="button" data-field="background" data-selected="0">
        <span class="label">背景颜色</span><span class="value">白色</span><span class="arrow">›</span>
      </button>
    </section>
  </main>

  <section class="closed" id="closedPage" hidden>
    <p>个人资料页面已关闭</p>
  </section>

  <div class="overlay" id="overlay" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
      <div class="dialog-head">
        <h2 id="dialogTitle">请选择</h2>
        <button class="dialog-close" id="dialogClose" type="button" aria-label="关闭选项">×</button>
      </div>
      <div class="choices" id="choices" role="radiogroup"></div>
    </div>
  </div>

  <div class="overlay" id="settingsOverlay" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="dialog-head">
        <h2 id="settingsTitle">设置</h2>
        <button class="dialog-close" id="settingsClose" type="button" aria-label="关闭设置">×</button>
      </div>
      <div class="settings-list">
        <button class="settings-item" type="button" data-open-field="theme">
          <span id="settingsThemeLabel">主题颜色</span><span class="arrow">›</span>
        </button>
        <button class="settings-item" type="button" data-open-field="background">
          <span id="settingsBackgroundLabel">背景颜色</span><span class="arrow">›</span>
        </button>
        <button class="settings-item" type="button" data-open-field="language">
          <span id="settingsLanguageLabel">常用语言</span><span class="arrow">›</span>
        </button>
        <button class="settings-item" id="changePasswordOpen" type="button">
          <span id="settingsPasswordLabel">修改密码</span><span class="arrow">›</span>
        </button>
      </div>
    </div>
  </div>

  <div class="overlay" id="changePasswordOverlay" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="changePasswordTitle">
      <div class="dialog-head">
        <h2 id="changePasswordTitle">修改密码</h2>
        <button class="dialog-close" id="changePasswordClose" type="button" aria-label="关闭修改密码">×</button>
      </div>
      <form class="change-password-form" id="changePasswordForm">
        <input class="password-input" id="oldPassword" type="password" placeholder="原密码" aria-label="原密码" autocomplete="current-password" required>
        <input class="password-input" id="newPassword" type="password" placeholder="新密码" aria-label="新密码" autocomplete="new-password" required>
        <input class="password-input" id="confirmPassword" type="password" placeholder="再次输入新密码" aria-label="再次输入新密码" autocomplete="new-password" required>
        <button class="unlock-button" id="savePasswordButton" type="submit">保存密码</button>
        <p class="change-password-message" id="changePasswordMessage" role="alert" aria-live="polite"></p>
      </form>
    </div>
  </div>

  <script>
    const translations = {
      zh: {
        title: '个人资料', closeProfile: '关闭个人资料', listLabel: '个人资料字段', choose: '请选择', closeOptions: '关闭选项', closed: '个人资料页面已关闭', empty: '未填写',
        labels: ['昵称','性别','生日','所在地','个人简介','感情状态','职业','教育程度','学校','兴趣爱好','常用语言','家乡','星座','主题颜色','资料可见范围','背景颜色'],
        placeholders: { nickname: '请输入昵称', bio: '请输入个人简介', occupation: '请输入职业', school: '请输入学校名称', hometown: '请输入家乡' },
        options: {
          gender: ['女','男','非二元','不愿透露'], location: ['北京','上海','广州','深圳','杭州','成都','其他'], relationship: ['单身','恋爱中','已婚','保密'], education: ['高中及以下','专科','本科','硕士','博士','其他'], interests: ['旅行','摄影','阅读','音乐','电影','运动','美食','游戏'], language: ['中文','廣東話','English','日本語','한국어','Français'], theme: ['红色','橙色','黄色','绿色','青色','蓝色','靛蓝色','紫色','粉色','灰色'], zodiac: ['白羊座','金牛座','双子座','巨蟹座','狮子座','处女座','天秤座','天蝎座','射手座','摩羯座','水瓶座','双鱼座'], visibility: ['所有人','仅好友','仅自己'], background: ['白色','红色','橙色','黄色','绿色','青色','蓝色','靛蓝色','紫色','粉色','灰色']
        }
      },
      yue: {
        title: '個人資料', closeProfile: '關閉個人資料', listLabel: '個人資料欄位', choose: '請選擇', closeOptions: '關閉選項', closed: '個人資料頁面已關閉', empty: '未填寫',
        labels: ['暱稱','性別','生日','所在地','個人簡介','感情狀態','職業','教育程度','學校','興趣愛好','常用語言','家鄉','星座','主題顏色','資料可見範圍','背景顏色'],

    async function loadWorldwideStates() {
      if (worldwideStatesLoaded) return countryStates;
      if (worldwideStatesPromise) return worldwideStatesPromise;
      worldwideStatesPromise = fetch('https://countriesnow.space/api/v0.1/countries/states')
        .then(response => {
          if (!response.ok) throw new Error('City catalog unavailable');
          return response.json();
        })
        .then(result => {
          if (result.error || !Array.isArray(result.data)) throw new Error('Invalid city catalog');
          const complete = {};
          result.data.forEach(entry => {
            if (!entry.name || !Array.isArray(entry.states)) return;
            if (/taiwan/i.test(entry.name)) return;
            complete[entry.name] = [...new Set(entry.states
              .map(state => {
                const name = state.name || '';
                if (/taiwan/i.test(name)) return null;
                return entry.name === 'China' && name === 'Shaanxi' ? 'Shanxi' : name;
              })
              .filter(Boolean))]
              .sort((a, b) => a.localeCompare(b, 'en'));
          });
          if (complete.China && !complete.China.includes('Taiwan')) {
            complete.China.push('Taiwan');
            complete.China.sort((a, b) => a.localeCompare(b, 'en'));
          }
          if (Object.keys(complete).length < 190) throw new Error('Incomplete state catalog');
          countryStates = complete;
          worldwideStatesLoaded = true;
          return countryStates;
        })
        .catch(error => {
          worldwideStatesPromise = null;
          throw error;
        });
      return worldwideStatesPromise;

      const gapY = margin + Math.random() * (groundTop - gap - margin * 2);
      fbPipes.push({ x: fbWidth + 20, width: Math.max(67, fbWidth * .14), gapY, gap, scored: false });
    }
    function endFlappy() {
      if (fbState !== 'running') return;
      const interfaceText = interfaceTranslations[currentLanguage];
      fbState = 'over'; fbBest = Math.max(fbBest, fbScoreValue);
      try { localStorage.setItem('skyHopperBest', fbBest); } catch (error) {}
      flappyMessageTitle.textContent = interfaceText.gameOver;
      flappyMessageText.textContent = interfaceText.retry;
      flappyResult.textContent = `${interfaceText.score}: ${fbScoreValue}  ·  ${interfaceText.best}: ${fbBest}`;
      flappyMessage.hidden = false;
    }
    function updateFlappy(dt) {
      fbBird.wing = Math.max(0, fbBird.wing - dt * 5);
      if (fbState === 'ready') { fbBird.y = fbHeight * .44 + Math.sin(performance.now() / 260) * 8; fbBird.rotation = 0; return; }
      if (fbState !== 'running') return;
      fbBird.velocity += 1380 * dt; fbBird.y += fbBird.velocity * dt;
      fbBird.rotation = Math.max(-.45, Math.min(1.25, fbBird.velocity / 600));
      fbGroundOffset = (fbGroundOffset + 125 * dt) % 38; fbPipeTimer += dt; fbRunTime += dt;
      const spawnInterval = Math.max(.55, 1.55 - fbRunTime * .008 - fbScoreValue * .012);
      if (fbPipeTimer > spawnInterval) { fbPipeTimer = 0; addFlappyPipe(); }
      const speed = 185 + fbRunTime * 6;
      for (let i = fbPipes.length - 1; i >= 0; i--) {
        const pipe = fbPipes[i]; pipe.x -= speed * dt;
        if (!pipe.scored && pipe.x + pipe.width < fbBird.x) { pipe.scored = true; fbScoreValue++; flappyScore.textContent = fbScoreValue; }
        const overlaps = fbBird.x + fbBird.radius > pipe.x && fbBird.x - fbBird.radius < pipe.x + pipe.width;
        if (overlaps && (fbBird.y - fbBird.radius < pipe.gapY || fbBird.y + fbBird.radius > pipe.gapY + pipe.gap)) endFlappy();
        if (pipe.x + pipe.width < -20) fbPipes.splice(i, 1);
      }
      if (fbBird.y - fbBird.radius < 0 || fbBird.y + fbBird.radius > fbHeight - 82) endFlappy();
    }
    function fbRoundedRect(x, y, w, h, r, fill) {
      flappyCtx.beginPath(); flappyCtx.roundRect(x, y, w, h, r); flappyCtx.fillStyle = fill; flappyCtx.fill();
    }
    function drawFlappyCloud(x, y, size) {
      flappyCtx.fillStyle = 'rgba(255,255,255,.7)'; flappyCtx.beginPath();
      flappyCtx.arc(x, y, size * .34, 0, Math.PI * 2); flappyCtx.arc(x + size * .36, y - size * .16, size * .42, 0, Math.PI * 2);
      flappyCtx.arc(x + size * .78, y, size * .3, 0, Math.PI * 2); flappyCtx.fill();
    }
    function drawFlappyBird() {
      const c = flappyCtx; c.save(); c.translate(fbBird.x, fbBird.y); c.rotate(fbBird.rotation);
      c.lineWidth = 3; c.strokeStyle = '#713f28'; c.fillStyle = '#ffd84d'; c.beginPath(); c.ellipse(0,0,24,19,0,0,Math.PI*2); c.fill(); c.stroke();
      c.fillStyle = '#ff9f43'; c.beginPath(); c.moveTo(19,-3); c.lineTo(36,3); c.lineTo(19,9); c.closePath(); c.fill(); c.stroke();
      c.fillStyle = '#fff'; c.beginPath(); c.arc(10,-9,8,0,Math.PI*2); c.fill(); c.stroke(); c.fillStyle = '#20272a'; c.beginPath(); c.arc(13,-9,3,0,Math.PI*2); c.fill();
      c.save(); c.rotate(-.35 - fbBird.wing * .8); c.fillStyle = '#f3a936'; c.beginPath(); c.ellipse(-10,5,14,8,0,0,Math.PI*2); c.fill(); c.stroke(); c.restore(); c.restore();
    }
    function drawFlappyPipe(pipe) {
      const c = flappyCtx, groundTop = fbHeight - 82;
      const gradient = c.createLinearGradient(pipe.x,0,pipe.x+pipe.width,0);
      const underground = fbScoreValue >= 15;
      if (underground) {
        gradient.addColorStop(0,'#7a4a2a'); gradient.addColorStop(.5,'#b8733e'); gradient.addColorStop(1,'#58351f');
      } else {
        gradient.addColorStop(0,'#60b83f'); gradient.addColorStop(.5,'#9be75e'); gradient.addColorStop(1,'#3f9133');
      }
      c.fillStyle = gradient; c.strokeStyle = underground ? '#3d2618' : '#286d2d'; c.lineWidth = 3;
      c.fillRect(pipe.x,0,pipe.width,pipe.gapY-22); c.strokeRect(pipe.x,-2,pipe.width,pipe.gapY-20);
      fbRoundedRect(pipe.x-7,pipe.gapY-28,pipe.width+14,28,4,gradient); c.strokeRect(pipe.x-7,pipe.gapY-28,pipe.width+14,28);
      const lowerY = pipe.gapY + pipe.gap;
      fbRoundedRect(pipe.x-7,lowerY,pipe.width+14,28,4,gradient); c.strokeRect(pipe.x-7,lowerY,pipe.width+14,28);
      c.fillStyle = gradient; c.fillRect(pipe.x,lowerY+28,pipe.width,groundTop-lowerY-28); c.strokeRect(pipe.x,lowerY+27,pipe.width,groundTop-lowerY-25);
    }
    function drawFlappy() {
      const c = flappyCtx, underground = fbScoreValue >= 15;
      if (underground) {
        const soil = c.createLinearGradient(0,0,0,fbHeight);
        soil.addColorStop(0,'#6b442b'); soil.addColorStop(.45,'#9a6742'); soil.addColorStop(1,'#4a2f20');
        c.fillStyle=soil; c.fillRect(0,0,fbWidth,fbHeight);
        c.fillStyle='rgba(55,31,19,.34)';
        for(let x=18;x<fbWidth;x+=58){
          const y=70+((x*47)%Math.max(120,fbHeight-190));
          c.beginPath(); c.ellipse(x,y,7+(x%9),5+(x%6),x*.02,0,Math.PI*2); c.fill();
        }
        c.strokeStyle='rgba(48,75,30,.7)'; c.lineWidth=4;
        for(let x=35;x<fbWidth;x+=105){c.beginPath();c.moveTo(x,0);c.quadraticCurveTo(x+18,38,x-4,78);c.stroke();}
        c.fillStyle='#382419'; c.fillRect(0,0,fbWidth,20);
      } else {
        const sky = c.createLinearGradient(0,0,0,fbHeight);
        sky.addColorStop(0,'#72d3f3'); sky.addColorStop(1,'#c8f3fb'); c.fillStyle=sky; c.fillRect(0,0,fbWidth,fbHeight);
        drawFlappyCloud(fbWidth*.08,fbHeight*.2,70); drawFlappyCloud(fbWidth*.68,fbHeight*.31,88);
        c.fillStyle='#9ad66c'; c.beginPath(); c.moveTo(0,fbHeight-105);
        for(let x=0;x<=fbWidth+50;x+=50)c.quadraticCurveTo(x+25,fbHeight-145,x+50,fbHeight-105);
        c.lineTo(fbWidth,fbHeight); c.lineTo(0,fbHeight); c.fill();
      }
      fbPipes.forEach(drawFlappyPipe);
      if(underground){
        const rockTop=fbHeight-82;
        c.fillStyle='#3f291d'; c.fillRect(0,rockTop+10,fbWidth,72);
        for(let i=-2,x=-fbGroundOffset-36;x<fbWidth+36;i++,x+=30){
          const radius=12+(Math.abs(i)%4)*3;
          c.fillStyle=i%2===0?'#705039':'#5a3e2d';
          c.beginPath(); c.arc(x,rockTop+radius,radius,Math.PI,Math.PI*2); c.fill();
          c.fillRect(x-radius,rockTop+radius-1,radius*2,83-radius);
          c.fillStyle='rgba(255,255,255,.12)';
          c.beginPath(); c.arc(x-4,rockTop+radius-3,Math.max(2,radius*.22),0,Math.PI*2); c.fill();
        }
      }else{
        c.fillStyle='#d9b864'; c.fillRect(0,fbHeight-82,fbWidth,82);
        c.fillStyle='#83c950'; c.fillRect(0,fbHeight-82,fbWidth,17);
        c.fillStyle='#e9d58e'; for(let x=-fbGroundOffset;x<fbWidth;x+=38)c.fillRect(x,fbHeight-57,21,7);
      }
      drawFlappyBird();
    }
    function flappyLoop(time) {
      const dt = Math.min((time-fbLastTime)/1000 || 0,.034); fbLastTime=time;
      if (!flappyView.hidden) { updateFlappy(dt); drawFlappy(); }
      requestAnimationFrame(flappyLoop);
    }
    function handleFlappyInput(event) {
      if (flappyView.hidden || event.target === flappyExit) return;
      if (event.type === 'keydown') { if (event.code !== 'Space' || event.repeat) return; event.preventDefault(); }
      flapBird();
    }
    window.addEventListener('keydown', handleFlappyInput);
    flappyShell.addEventListener('pointerdown', handleFlappyInput);
    flappyExit.addEventListener('click', closeFlappyBird);
    window.addEventListener('resize', resizeFlappy);
    requestAnimationFrame(flappyLoop);
  </script>
