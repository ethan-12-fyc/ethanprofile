<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>个人资料</title>

  <style>
    * { box-sizing: border-box; }

    :root {
      --row-color: #e9e9e9;
      --row-hover: #dfdfdf;
      --page-color: #ffffff;
      --header-color: rgba(255, 255, 255, .96);
      color-scheme: light;
      font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #151515;
      background: var(--page-color);
    }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--page-color);
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .page {
      width: 100%;
      min-height: 100vh;
      padding: 0 clamp(14px, 3vw, 44px) 52px;
      background: var(--page-color);
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 72px;
      background: var(--header-color);
      border-bottom: 1px solid #ededed;
      backdrop-filter: blur(8px);
    }

    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 500;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .close {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #555;
      font-size: 31px;
      line-height: 34px;
      cursor: pointer;
    }

    .close:hover,
    .close:focus-visible {
      background: #ededed;
      outline: none;
    }

    .settings-button {
      position: relative;
      top: -2px;
      font-size: 25px;
      line-height: 38px;
    }

    .list {
      display: grid;
      gap: 10px;
      padding-top: 18px;
    }

    .row.settings-only { display: none; }

    .row {
      min-height: 58px;
      display: grid;
      grid-template-columns: minmax(90px, 22%) 1fr auto;
      align-items: center;
      gap: 16px;
      padding: 10px 18px;
      border: 0;
      border-radius: 7px;
      background: var(--row-color);
      text-align: left;
    }

    button.row {
      width: 100%;
      cursor: pointer;
    }

    button.row:hover { background: var(--row-hover); }

    button.row:focus-visible {
      outline: 2px solid #333;
      outline-offset: 2px;
    }

    .label {
      font-size: 15px;
      color: #222;
    }

    .value {
      min-width: 0;
      color: #111;
      text-align: right;
      overflow-wrap: anywhere;
    }

    .muted { color: #707070; }

    .arrow {
      color: #666;
      font-size: 22px;
    }

    .text-input {
      width: 100%;
      min-width: 0;
      padding: 8px 10px;
      border: 1px solid transparent;
      border-radius: 5px;
      background: transparent;
      text-align: right;
      color: #111;
      outline: none;
    }

    .text-input:hover {
      background: rgba(255, 255, 255, .45);
    }

    .text-input:focus {
      border-color: #7d7d7d;
      background: #fff;
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(0, 0, 0, .34);
    }

    .overlay[hidden] { display: none; }

    .dialog {
      width: min(460px, 100%);
      max-height: min(650px, 84vh);
      overflow: auto;
      padding: 24px;
      border-radius: 12px;
      background: var(--page-color);
      box-shadow: 0 18px 60px rgba(0, 0, 0, .23);
    }

    .dialog-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .dialog h2 {
      margin: 0;
      font-size: 20px;
      font-weight: 500;
    }

    .dialog-close {
      border: 0;
      background: transparent;
      color: #666;
      font-size: 25px;
      cursor: pointer;
    }

    .choices {
      display: grid;
      gap: 9px;
    }

    .choice {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid #d5d5d5;
      border-radius: 7px;
      background: #f4f4f4;
      text-align: left;
      cursor: pointer;
    }

    .choice:hover,
    .choice:focus-visible {
      border-color: #555;
      background: #e8e8e8;
      outline: none;
    }

    .choice[aria-checked="true"] {
      border-color: #222;
      background: #dedede;
      font-weight: 600;
    }

    .settings-list {
      display: grid;
      gap: 10px;
    }

    .settings-item {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 15px;
      border: 0;
      border-radius: 7px;
      background: var(--row-color);
      text-align: left;
      cursor: pointer;
    }

    .settings-item:hover,
    .settings-item:focus-visible {
      background: var(--row-hover);
      outline: 2px solid #333;
    }

    .color-dot {
      display: inline-block;
      width: 18px;
      height: 18px;
      margin-right: 11px;
      border: 1px solid rgba(0, 0, 0, .18);
      border-radius: 4px;
      vertical-align: -4px;
    }

    .closed {
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: #666;
      background: #f5f5f5;
    }

    .closed[hidden] { display: none; }

    .lock-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f5f5f5;
    }

    .lock-screen[hidden] { display: none; }

    .password-form {
      width: min(420px, 100%);
      text-align: center;
    }

    .password-input {
      width: 100%;
      height: 58px;
      padding: 0 18px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: #e9e9e9;
      color: #111;
      font-weight: 400;
      text-align: center;
      outline: none;
    }

    .password-input:focus {
      border-color: #777;
      background: #e2e2e2;
    }

    .password-input::placeholder {
      color: #333;
      opacity: 1;
    }

    .unlock-button {
      margin-top: 12px;
      padding: 10px 24px;
      border: 0;
      border-radius: 7px;
      background: #555;
      color: #fff;
      cursor: pointer;
    }

    .password-error {
      min-height: 22px;
      margin: 10px 0 0;
      color: #a12626;
      font-size: 14px;
    }

    .change-password-form {
      display: grid;
      gap: 10px;
    }

    .change-password-form .password-input {
      height: 50px;
    }

    .change-password-message {
      min-height: 21px;
      margin: 0;
      color: #a12626;
      font-size: 14px;
      text-align: center;
    }

    .change-password-message.success {
      color: #23713c;
    }

    @media (max-width: 560px) {
      .page { padding-inline: 12px; }
      .header { height: 62px; }
      h1 { font-size: 21px; }

      .row {
        grid-template-columns: 84px 1fr auto;
        gap: 8px;
        padding-inline: 13px;
      }

      .label,
      .value,
      .text-input {
        font-size: 14px;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      .dialog { animation: appear .18s ease-out; }

      @keyframes appear {
        from {
          transform: translateY(8px);
          opacity: 0;
        }
      }
    }
  </style>
</head>

<body>
  <section class="lock-screen" id="lockScreen">
    <form class="password-form" id="passwordForm">
      <input
        class="password-input"
        id="passwordInput"
        type="password"
        placeholder="密码"
        aria-label="密码"
        autocomplete="current-password"
        required
      >
      <button class="unlock-button" type="submit">打开</button>
      <p
        class="password-error"
        id="passwordError"
        role="alert"
        aria-live="polite"
      ></p>
    </form>
  </section>

  <main class="page" id="profilePage" hidden>
    <header class="header">
      <h1 id="pageTitle">个人资料</h1>

      <div class="header-actions">
        <button
          class="close settings-button"
          id="settingsOpen"
          type="button"
          aria-label="设置"
        >⚙</button>

        <button
          class="close"
          id="pageClose"
          type="button"
          aria-label="关闭个人资料"
        >×</button>
      </div>
    </header>

    <section class="list" id="profileList" aria-label="个人资料字段">
      <label class="row" data-field="nickname">
        <span class="label">昵称</span>
        <input
          class="text-input"
          type="text"
          value="林晓雨"
          aria-label="昵称"
        >
        <span class="arrow">›</span>
      </label>

      <button
        class="row select-row"
        type="button"
        data-field="gender"
        data-selected="0"
      >
        <span class="label">性别</span>
        <span class="value">女</span>
        <span class="arrow">›</span>
      </button>

      <label class="row" data-field="birthday">
        <span class="label">生日</span>
        <input
          class="text-input"
          type="date"
          value="1998-06-18"
          aria-label="生日"
        >
        <span class="arrow">›</span>
      </label>

      <button
        class="row select-row"
        type="button"
        data-field="location"
        data-selected="1"
      >
        <span class="label">所在地</span>
        <span class="value">上海</span>
        <span class="arrow">›</span>
      </button>

      <label class="row" data-field="bio">
        <span class="label">个人简介</span>
        <input
          class="text-input"
          type="text"
          value="记录生活中的小美好"
          aria-label="个人简介"
        >
        <span class="arrow">›</span>
      </label>

      <button
        class="row select-row"
        type="button"
        data-field="relationship"
        data-selected="-1"
      >
        <span class="label">感情状态</span>
        <span class="value muted">未填写</span>
        <span class="arrow">›</span>
      </button>

      <label class="row" data-field="occupation">
        <span class="label">职业</span>
        <input
          class="text-input"
          type="text"
          placeholder="请输入职业"
          aria-label="职业"
        >
        <span class="arrow">›</span>
      </label>

      <button
        class="row select-row"
        type="button"
        data-field="education"
        data-selected="2"
      >
        <span class="label">教育程度</span>
        <span class="value">本科</span>
        <span class="arrow">›</span>
      </button>

      <label class="row" data-field="school">
        <span class="label">学校</span>
        <input
          class="text-input"
          type="text"
          placeholder="请输入学校名称"
          aria-label="学校"
        >
        <span class="arrow">›</span>
      </label>

      <button
        class="row select-row"
        type="button"
        data-field="interests"
        data-selected="1"
      >
        <span class="label">兴趣爱好</span>
        <span class="value">摄影</span>
        <span class="arrow">›</span>
      </button>

      <button
        class="row select-row"
        type="button"
        data-field="language"
        data-selected="0"
      >
        <span class="label">常用语言</span>
        <span class="value">中文</span>
        <span class="arrow">›</span>
      </button>

      <label class="row" data-field="hometown">
        <span class="label">家乡</span>
        <input
          class="text-input"
          type="text"
          value="苏州"
          aria-label="家乡"
        >
        <span class="arrow">›</span>
      </label>

      <button
        class="row select-row"
        type="button"
        data-field="zodiac"
        data-selected="2"
      >
        <span class="label">星座</span>
        <span class="value">双子座</span>
        <span class="arrow">›</span>
      </button>

      <button
        class="row select-row settings-only"
        type="button"
        data-field="theme"
        data-selected="9"
      >
        <span class="label">主题颜色</span>
        <span class="value">灰色</span>
        <span class="arrow">›</span>
      </button>

      <button
        class="row select-row settings-only"
        type="button"
        data-field="visibility"
        data-selected="0"
      >
        <span class="label">资料可见范围</span>
        <span class="value">所有人</span>
        <span class="arrow">›</span>
      </button>

      <button
        class="row select-row settings-only"
        type="button"
        data-field="background"
        data-selected="0"
      >
        <span class="label">背景颜色</span>
        <span class="value">白色</span>
        <span class="arrow">›</span>
      </button>
    </section>
  </main>

  <section class="closed" id="closedPage" hidden>
    <p>个人资料页面已关闭</p>
  </section>

  <div class="overlay" id="overlay" hidden>
    <div
      class="dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="dialogTitle"
    >
      <div class="dialog-head">
        <h2 id="dialogTitle">请选择</h2>
        <button
          class="dialog-close"
          id="dialogClose"
          type="button"
          aria-label="关闭选项"
        >×</button>
      </div>

      <div class="choices" id="choices" role="radiogroup"></div>
    </div>
  </div>

  <div class="overlay" id="settingsOverlay" hidden>
    <div
      class="dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="settingsTitle"
    >
      <div class="dialog-head">
        <h2 id="settingsTitle">设置</h2>
        <button
          class="dialog-close"
          id="settingsClose"
          type="button"
          aria-label="关闭设置"
        >×</button>
      </div>

      <div class="settings-list">
        <button
          class="settings-item"
          type="button"
          data-open-field="theme"
        >
          <span id="settingsThemeLabel">主题颜色</span>
          <span class="arrow">›</span>
        </button>

        <button
          class="settings-item"
          type="button"
          data-open-field="background"
        >
          <span id="settingsBackgroundLabel">背景颜色</span>
          <span class="arrow">›</span>
        </button>

        <button
          class="settings-item"
          id="changePasswordOpen"
          type="button"
        >
          <span id="settingsPasswordLabel">修改密码</span>
          <span class="arrow">›</span>
        </button>

        <button
          class="settings-item"
          type="button"
          data-open-field="visibility"
        >
          <span id="settingsVisibilityLabel">资料可见范围</span>
          <span class="arrow">›</span>
        </button>
      </div>
    </div>
  </div>

  <div class="overlay" id="changePasswordOverlay" hidden>
    <div
      class="dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="changePasswordTitle"
    >
      <div class="dialog-head">
        <h2 id="changePasswordTitle">修改密码</h2>

        <button
          class="dialog-close"
          id="changePasswordClose"
          type="button"
          aria-label="关闭修改密码"
        >×</button>
      </div>

      <form class="change-password-form" id="changePasswordForm">
        <input
          class="password-input"
          id="oldPassword"
          type="password"
          placeholder="原密码"
          aria-label="原密码"
          autocomplete="current-password"
          required
        >

        <input
          class="password-input"
          id="newPassword"
          type="password"
          placeholder="新密码"
          aria-label="新密码"
          autocomplete="new-password"
          required
        >

        <input
          class="password-input"
          id="confirmPassword"
          type="password"
          placeholder="再次输入新密码"
          aria-label="再次输入新密码"
          autocomplete="new-password"
          required
        >

        <button
          class="unlock-button"
          id="savePasswordButton"
          type="submit"
        >保存密码</button>

        <p
          class="change-password-message"
          id="changePasswordMessage"
          role="alert"
          aria-live="polite"
        ></p>
      </form>
    </div>
  </div>

      fr: {

        ],

        placeholders: {
          occupation: 'Saisissez votre profession',
          school: 'Saisissez votre école'
        },

        options: {
          gender: ['Femme', 'Homme', 'Non-binaire', 'Je préfère ne pas répondre'],
          location: ['Pékin', 'Shanghai', 'Canton', 'Shenzhen', 'Hangzhou', 'Chengdu', 'Autre'],
          relationship: ['Célibataire', 'En couple', 'Marié(e)', 'Privé'],
          education: ['Lycée ou inférieur', 'Bac +2', 'Licence', 'Master', 'Doctorat', 'Autre'],
          interests: ['Voyage', 'Photographie', 'Lecture', 'Musique', 'Cinéma', 'Sport', 'Cuisine', 'Jeux vidéo'],
          language: ['中文', 'English', '日本語', '한국어', 'Français'],
          theme: ['Rouge', 'Orange', 'Jaune', 'Vert', 'Cyan', 'Bleu', 'Indigo', 'Violet', 'Rose', 'Gris'],
          zodiac: ['Bélier', 'Taureau', 'Gémeaux', 'Cancer', 'Lion', 'Vierge', 'Balance', 'Scorpion', 'Sagittaire', 'Capricorne', 'Verseau', 'Poissons'],

          background: ['Blanc', 'Rouge', 'Orange', 'Jaune', 'Vert', 'Cyan', 'Bleu', 'Indigo', 'Violet', 'Rose', 'Gris']
        }
      }
    };

    const languageCodes = ['zh', 'en', 'ja', 'ko', 'fr'];

    const settingsTranslations = {
      zh: ['设置', '主题颜色', '资料可见范围', '关闭设置', '修改密码', '背景颜色'],
      en: ['Settings', 'Theme color', 'Profile visibility', 'Close settings', 'Change password', 'Background color'],
      ja: ['設定', 'テーマカラー', '公開範囲', '設定を閉じる', 'パスワードを変更', '背景色'],
      ko: ['설정', '테마 색상', '공개 범위', '설정 닫기', '비밀번호 변경', '배경색'],
      fr: ['Paramètres', 'Couleur du thème', 'Visibilité du profil', 'Fermer les paramètres', 'Modifier le mot de passe', 'Couleur d’arrière-plan']
    };

    const passwordTranslations = {
      zh: ['修改密码', '原密码', '新密码', '再次输入新密码', '保存密码', '关闭修改密码', '原密码不正确', '两次输入的新密码不一致', '密码已修改'],
      en: ['Change password', 'Current password', 'New password', 'Enter new password again', 'Save password', 'Close password change', 'Current password is incorrect', 'New passwords do not match', 'Password changed'],
      ja: ['パスワードを変更', '現在のパスワード', '新しいパスワード', '新しいパスワードを再入力', 'パスワードを保存', 'パスワード変更を閉じる', '現在のパスワードが正しくありません', '新しいパスワードが一致しません', 'パスワードを変更しました'],
      ko: ['비밀번호 변경', '현재 비밀번호', '새 비밀번호', '새 비밀번호 다시 입력', '비밀번호 저장', '비밀번호 변경 닫기', '현재 비밀번호가 올바르지 않습니다', '새 비밀번호가 일치하지 않습니다', '비밀번호가 변경되었습니다'],
      fr: ['Modifier le mot de passe', 'Mot de passe actuel', 'Nouveau mot de passe', 'Confirmez le nouveau mot de passe', 'Enregistrer', 'Fermer', 'Le mot de passe actuel est incorrect', 'Les nouveaux mots de passe ne correspondent pas', 'Mot de passe modifié']
    };

    const themeColors = [
      ['#f5dcdc', '#eccaca'],
      ['#f6e3cf', '#eed3b5'],
      ['#f5efc9', '#ece2ac'],
      ['#dcefe3', '#cbe4d4'],
      ['#d8f0ef', '#c4e5e3'],
      ['#dce9f8', '#cbdcf1'],
      ['#e0e1f3', '#ced0e9'],
      ['#e7def4', '#d9cceb'],
      ['#f3dee8', '#eacbd9'],
      ['#e9e9e9', '#dfdfdf']
    ];

    const backgroundColors = [
      '#ffffff',
      '#fff1f1',
      '#fff3e7',
      '#fffbe0',
      '#effaf2',
      '#eafafa',
      '#eef5ff',
      '#f0f0fb',
      '#f6f0ff',
      '#fff0f6',
      '#f1f1f1'
    ];

    let currentLanguage = 'zh';
    let activeRow = null;

    const overlay = document.getElementById('overlay');
    const choices = document.getElementById('choices');
    const dialogTitle = document.getElementById('dialogTitle');
    const dialogClose = document.getElementById('dialogClose');
    const settingsOverlay = document.getElementById('settingsOverlay');
    const settingsOpen = document.getElementById('settingsOpen');
    const settingsClose = document.getElementById('settingsClose');
    const changePasswordOverlay = document.getElementById('changePasswordOverlay');
    const changePasswordOpen = document.getElementById('changePasswordOpen');
    const changePasswordClose = document.getElementById('changePasswordClose');

    function applyLanguage(code) {
      currentLanguage = code;
      const text = translations[code];

      document.documentElement.lang = code === 'zh' ? 'zh-CN' : code;
      document.title = text.title;
      document.getElementById('pageTitle').textContent = text.title;
      document.getElementById('pageClose').setAttribute(
        'aria-label',
        text.closeProfile
      );

      const settings = settingsTranslations[code];

      settingsOpen.setAttribute('aria-label', settings[0]);
      document.getElementById('settingsTitle').textContent = settings[0];
      document.getElementById('settingsThemeLabel').textContent = settings[1];
      document.getElementById('settingsVisibilityLabel').textContent = settings[2];
      settingsClose.setAttribute('aria-label', settings[3]);
      document.getElementById('settingsPasswordLabel').textContent = settings[4];
      document.getElementById('settingsBackgroundLabel').textContent = settings[5];

      const passwordText = passwordTranslations[code];

      document.getElementById('changePasswordTitle').textContent =
        passwordText[0];

      [
        ['oldPassword', 1],
        ['newPassword', 2],
        ['confirmPassword', 3]
      ].forEach(([id, index]) => {
        const input = document.getElementById(id);
        input.placeholder = passwordText[index];
        input.setAttribute('aria-label', passwordText[index]);
      });

      document.getElementById('savePasswordButton').textContent =
        passwordText[4];

      changePasswordClose.setAttribute(
        'aria-label',
        passwordText[5]
      );

      document.getElementById('profileList').setAttribute(
        'aria-label',
        text.listLabel
      );

      dialogClose.setAttribute('aria-label', text.closeOptions);
      document.querySelector('#closedPage p').textContent = text.closed;

      document.querySelectorAll('.row[data-field]').forEach((row, index) => {
        const field = row.dataset.field;
        row.querySelector('.label').textContent = text.labels[index];

        const input = row.querySelector('input');

        if (input) {
          input.setAttribute('aria-label', text.labels[index]);

          if (text.placeholders[field]) {
            input.placeholder = text.placeholders[field];
          }
        }

        if (row.classList.contains('select-row')) {
          const selected = Number(row.dataset.selected);
          const value = row.querySelector('.value');

          value.textContent =
            selected < 0
              ? text.empty
              : text.options[field][selected];

          value.classList.toggle('muted', selected < 0);
        }
      });
    }

    function closeDialog() {
      overlay.hidden = true;
      document.body.style.overflow = '';

      if (activeRow) {
        activeRow.focus();
      }
    }

    function applyTheme(index) {
      const [normal, hover] = themeColors[index];

      document.documentElement.style.setProperty(
        '--row-color',
        normal
      );

      document.documentElement.style.setProperty(
        '--row-hover',
        hover
      );
    }

    function applyBackground(index) {
      const color = backgroundColors[index];

      document.documentElement.style.setProperty(
        '--page-color',
        color
      );

      document.documentElement.style.setProperty(
        '--header-color',
        color
      );

      document.querySelector(
        'meta[name="theme-color"]'
      ).content = color;
    }

    function saveProfile() {
      const fields = {};

      document.querySelectorAll('.row[data-field]').forEach(row => {
        const field = row.dataset.field;
        const input = row.querySelector('input');

        fields[field] = input
          ? input.value
          : Number(row.dataset.selected);
      });

      try {
        localStorage.setItem(
          'profileData',
          JSON.stringify({
            language: currentLanguage,
            fields
          })
        );
      } catch (error) {}
    }

    function restoreProfile() {
      let saved;

      try {
        saved = JSON.parse(localStorage.getItem('profileData'));
      } catch (error) {
        saved = null;
      }

      if (!saved || !saved.fields) {
        return {
          language: 'zh',
          theme: 9,
          background: 0
        };
      }

      document.querySelectorAll('.row[data-field]').forEach(row => {
        const field = row.dataset.field;

        if (!(field in saved.fields)) {
          return;
        }

        const input = row.querySelector('input');

        if (input) {
          input.value = saved.fields[field];
        } else {
          row.dataset.selected = saved.fields[field];
        }
      });

      const language = translations[saved.language]
        ? saved.language
        : 'zh';

      const theme = Number(saved.fields.theme);
      const background = Number(saved.fields.background);

      return {
        language,
        theme: themeColors[theme] ? theme : 9,
        background: backgroundColors[background]
          ? background
          : 0
      };
    }

    document
      .querySelectorAll('.row[data-field] input')
      .forEach(input => {
        input.addEventListener('input', saveProfile);
        input.addEventListener('change', saveProfile);
      });

    document.querySelectorAll('.select-row').forEach(row => {
      row.addEventListener('click', () => {
        activeRow = row;

        const text = translations[currentLanguage];
        const field = row.dataset.field;
        const current = Number(row.dataset.selected);

        const rowIndex = [
          ...document.querySelectorAll('.row[data-field]')
        ].indexOf(row);

        dialogTitle.textContent = text.labels[rowIndex];
        choices.replaceChildren();

        text.options[field].forEach((option, optionIndex) => {
          const button = document.createElement('button');

          button.type = 'button';
          button.className = 'choice';
          button.setAttribute('role', 'radio');
          button.setAttribute(
            'aria-checked',
            String(optionIndex === current)
          );

          button.textContent = option;

          if (
            field === 'theme' ||
            field === 'background'
          ) {
            const swatch = document.createElement('span');
            swatch.className = 'color-dot';

            swatch.style.background =
              field === 'theme'
                ? themeColors[optionIndex][0]
                : backgroundColors[optionIndex];

            button.prepend(swatch);
          }

          button.addEventListener('click', () => {
            row.dataset.selected = optionIndex;
            closeDialog();

            if (field === 'language') {
              applyLanguage(languageCodes[optionIndex]);
            } else if (field === 'theme') {
              applyTheme(optionIndex);
              row.querySelector('.value').textContent = option;
            } else if (field === 'background') {
              applyBackground(optionIndex);
              row.querySelector('.value').textContent = option;
            } else {
              const value = row.querySelector('.value');
              value.textContent = option;
              value.classList.remove('muted');
            }

            saveProfile();
          });

          choices.appendChild(button);
        });

        overlay.hidden = false;
        document.body.style.overflow = 'hidden';

        choices
          .querySelector('[aria-checked="true"]')
          ?.focus() ||
          choices.firstElementChild?.focus();
      });
    });

    dialogClose.addEventListener('click', closeDialog);

    overlay.addEventListener('click', event => {
      if (event.target === overlay) {
        closeDialog();
      }
    });

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && !overlay.hidden) {
        closeDialog();
      }

      if (
        event.key === 'Escape' &&
        !settingsOverlay.hidden
      ) {
        closeSettings();
      }

      if (
        event.key === 'Escape' &&
        !changePasswordOverlay.hidden
      ) {
        closeChangePassword();
      }
    });

    function closeSettings() {
      settingsOverlay.hidden = true;
      document.body.style.overflow = '';
      settingsOpen.focus();
    }

    settingsOpen.addEventListener('click', () => {
      settingsOverlay.hidden = false;
      document.body.style.overflow = 'hidden';

      settingsOverlay
        .querySelector('.settings-item')
        .focus();
    });

    settingsClose.addEventListener('click', closeSettings);

    settingsOverlay.addEventListener('click', event => {
      if (event.target === settingsOverlay) {
        closeSettings();
      }
    });

    document
      .querySelectorAll('[data-open-field]')
      .forEach(button => {
        button.addEventListener('click', () => {
          const field = button.dataset.openField;

          closeSettings();

          document
            .querySelector(
              `.select-row[data-field="${field}"]`
            )
            .click();
        });
      });

    function closeChangePassword() {
      changePasswordOverlay.hidden = true;
      document.body.style.overflow = '';

      document
        .getElementById('changePasswordForm')
        .reset();

      document.getElementById(
        'changePasswordMessage'
      ).textContent = '';

      changePasswordOpen.focus();
    }

    changePasswordOpen.addEventListener('click', () => {
      closeSettings();

      changePasswordOverlay.hidden = false;
      document.body.style.overflow = 'hidden';

      document.getElementById('oldPassword').focus();
    });

    changePasswordClose.addEventListener(
      'click',
      closeChangePassword
    );

    changePasswordOverlay.addEventListener(
      'click',
      event => {
        if (event.target === changePasswordOverlay) {
          closeChangePassword();
        }
      }
    );

    let sitePassword;

    try {
      sitePassword =
        localStorage.getItem('profilePassword') ||
        '1234';
    } catch (error) {
      sitePassword = '1234';
    }

    const lockScreen =
      document.getElementById('lockScreen');

    const profilePage =
      document.getElementById('profilePage');

    const passwordForm =
      document.getElementById('passwordForm');

    const passwordInput =
      document.getElementById('passwordInput');

    const passwordError =
      document.getElementById('passwordError');

    document
      .getElementById('changePasswordForm')
      .addEventListener('submit', event => {
        event.preventDefault();

        const passwordText =
          passwordTranslations[currentLanguage];

        const oldPassword =
          document.getElementById('oldPassword');

        const newPassword =
          document.getElementById('newPassword');

        const confirmPassword =
          document.getElementById('confirmPassword');

        const message =
          document.getElementById(
            'changePasswordMessage'
          );

        message.classList.remove('success');

        if (oldPassword.value !== sitePassword) {
          message.textContent = passwordText[6];
          oldPassword.select();
        } else if (
          newPassword.value !== confirmPassword.value
        ) {
          message.textContent = passwordText[7];
          confirmPassword.select();
        } else {
          sitePassword = newPassword.value;

          try {
            localStorage.setItem(
              'profilePassword',
              sitePassword
            );
          } catch (error) {}

          document
            .getElementById('changePasswordForm')
            .reset();

          message.classList.add('success');
          message.textContent = passwordText[8];
        }
      });

    passwordForm.addEventListener('submit', event => {
      event.preventDefault();

      if (
        passwordInput.value
          .trim()
          .toLowerCase() === 'flappybird'
      ) {
        window.location.href = 'flappy-bird.html';
        return;
      }

      if (passwordInput.value === sitePassword) {
        passwordError.textContent = '';
        passwordInput.value = '';
        lockScreen.hidden = true;
        profilePage.hidden = false;
        window.scrollTo(0, 0);
      } else {
        passwordError.textContent =
          '密码错误，请重试';

        passwordInput.select();
      }
    });

    document
      .getElementById('pageClose')
      .addEventListener('click', () => {
        saveProfile();

        overlay.hidden = true;
        settingsOverlay.hidden = true;
        changePasswordOverlay.hidden = true;
        profilePage.hidden = true;
        lockScreen.hidden = false;
        document.body.style.overflow = '';
        passwordInput.focus();
      });

    window.addEventListener('pagehide', saveProfile);

    const restoredProfile = restoreProfile();

    applyTheme(restoredProfile.theme);
    applyBackground(restoredProfile.background);
    applyLanguage(restoredProfile.language);
    passwordInput.focus();
  </script>
